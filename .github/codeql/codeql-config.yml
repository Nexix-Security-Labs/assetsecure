name: AssetSecure CodeQL config

# Analyze first-party JavaScript sources (resources/assets/js, etc.).
# Skip files that are published or compiled from third-party packages:
# - public/vendor/: assets published by Composer packages (e.g. Livewire,
#   regenerated by `vendor:publish --force` on every composer update)
# - public/js/: Laravel Mix bundles and copies built from resources/assets/js
#   and node_modules; their sources are analyzed directly
# Vulnerabilities in third-party packages are tracked via composer/npm audit
# and Dependabot instead.
paths-ignore:
  - public/vendor
  - public/js
