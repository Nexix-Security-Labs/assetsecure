# Compose file for production.

volumes:
  # "db" keeps the volume name used by earlier AssetSecure releases, so an
  # existing database is reused on upgrade.
  db:
  storage:

services:
  assetsecure:
    build:
      context: .
      dockerfile: Dockerfile
    image: assetsecure:${APP_VERSION:-latest}
    container_name: assetsecure
    restart: unless-stopped
    volumes:
      - storage:/var/lib/assetsecure
    ports:
      - "${APP_PORT:-8069}:80"
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  mariadb:
    # Set MARIADB_VERSION in .env to the version your existing data was created with.
    # Never point an existing data volume at an older MariaDB major/minor version.
    image: mariadb:${MARIADB_VERSION:-11.4.7}
    restart: unless-stopped
    volumes:
      - db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      # https://mariadb.com/kb/en/using-healthcheck-sh/#compose-file-example
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
